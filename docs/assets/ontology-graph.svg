<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440">
  <defs>
    <marker id="edge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6e7f91"/>
    </marker>
    <marker id="edgeHi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c6f24e"/>
    </marker>
  </defs>
  <rect width="1100" height="440" rx="14" fill="#090d12" stroke="#22303c" stroke-width="2"/>
  <text x="34" y="38" fill="#f4ede4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="0.8">OPTIONALITY CERTIFIED SEMANTIC ONTOLOGY : ENTITIES, CARDINALITIES AND MEASURES</text>

  <rect x="28" y="56" width="660" height="356" rx="10" fill="#0d131a" stroke="#1f2c38"/>

  <line x1="220" y1="130" x2="320" y2="195" stroke="#c6f24e" stroke-width="2" marker-end="url(#edgeHi)"/>
  <text x="228" y="152" fill="#c6f24e" font-family="monospace" font-size="10">1 : N (collateralizes)</text>

  <line x1="439" y1="215" x2="502" y2="135" stroke="#c6f24e" stroke-width="2" marker-end="url(#edgeHi)"/>
  <text x="425" y="166" fill="#c6f24e" font-family="monospace" font-size="10">1 : N (issues)</text>

  <line x1="439" y1="245" x2="502" y2="320" stroke="#6e7f91" stroke-width="1.8" marker-end="url(#edge)"/>
  <text x="420" y="298" fill="#8b98a5" font-family="monospace" font-size="10">1 : N (lists book)</text>

  <line x1="220" y1="330" x2="302" y2="255" stroke="#5fc39c" stroke-width="2" marker-end="url(#edge)"/>
  <text x="210" y="282" fill="#5fc39c" font-family="monospace" font-size="10">3-of-4 quorum fixes</text>

  <line x1="570" y1="206" x2="570" y2="160" stroke="#6e7f91" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#edge)"/>
  <text x="580" y="190" fill="#8b98a5" font-family="monospace" font-size="10">mirrors (TEE)</text>

  <rect x="48" y="88" width="172" height="72" rx="8" fill="#131d27" stroke="#2f4254" stroke-width="1.5"/>
  <text x="62" y="114" fill="#f4ede4" font-family="sans-serif" font-size="13" font-weight="700">PoolVault</text>
  <text x="62" y="132" fill="#8b98a5" font-family="monospace" font-size="10">free_liquidity: u128</text>
  <text x="62" y="146" fill="#8b98a5" font-family="monospace" font-size="10">locked_collateral: u128</text>

  <rect x="48" y="296" height="76" width="172" rx="8" fill="#131d27" stroke="#5fc39c" stroke-width="1.5"/>
  <text x="62" y="322" fill="#5fc39c" font-family="sans-serif" font-size="13" font-weight="700">OracleCommittee</text>
  <text x="62" y="340" fill="#8b98a5" font-family="monospace" font-size="10">seats: Pyth/Kraken/OKX</text>
  <text x="62" y="356" fill="#8b98a5" font-family="monospace" font-size="10">quorum: 3-of-4 median</text>

  <rect x="305" y="192" width="134" height="76" rx="8" fill="#17241a" stroke="#c6f24e" stroke-width="2.5"/>
  <text x="322" y="218" fill="#c6f24e" font-family="sans-serif" font-size="14" font-weight="800">Series *</text>
  <text x="322" y="236" fill="#e6edf3" font-family="monospace" font-size="10">series_id: u64</text>
  <text x="322" y="252" fill="#e6edf3" font-family="monospace" font-size="10">[K_low, K_high]</text>

  <rect x="506" y="82" width="152" height="74" rx="8" fill="#131d27" stroke="#c6f24e" stroke-width="1.5"/>
  <text x="522" y="108" fill="#f4ede4" font-family="sans-serif" font-size="13" font-weight="700">Ticket (Position)</text>
  <text x="522" y="126" fill="#8b98a5" font-family="monospace" font-size="10">ticket_id: u64 : owner</text>
  <text x="522" y="142" fill="#8b98a5" font-family="monospace" font-size="10">size: u6 : paid: u6</text>

  <rect x="506" y="206" width="152" height="64" rx="8" fill="#131d27" stroke="#2f4254" stroke-width="1.5"/>
  <text x="522" y="230" fill="#f4ede4" font-family="sans-serif" font-size="13" font-weight="700">CopyMandate</text>
  <text x="522" y="248" fill="#8b98a5" font-family="monospace" font-size="10">leader_id : follower</text>
  <text x="522" y="262" fill="#8b98a5" font-family="monospace" font-size="10">1Click Ed25519 quote</text>

  <rect x="506" y="298" width="152" height="72" rx="8" fill="#131d27" stroke="#2f4254" stroke-width="1.5"/>
  <text x="522" y="322" fill="#f4ede4" font-family="sans-serif" font-size="13" font-weight="700">RestingOrder</text>
  <text x="522" y="340" fill="#8b98a5" font-family="monospace" font-size="10">order_id: u64 : maker</text>
  <text x="522" y="356" fill="#8b98a5" font-family="monospace" font-size="10">price_per_unit: u6</text>

  <rect x="708" y="56" width="364" height="356" rx="10" fill="#101820" stroke="#2b3b4b" stroke-width="1.5"/>
  <text x="728" y="84" fill="#c6f24e" font-family="monospace" font-size="12" font-weight="700">SELECTED TERM INSPECTOR : SERIES AND TICKET</text>
  <line x1="728" y1="96" x2="1052" y2="96" stroke="#22303c"/>

  <text x="728" y="120" fill="#f4ede4" font-family="sans-serif" font-size="12" font-weight="700">Physical Source Bindings</text>
  <text x="728" y="140" fill="#8b98a5" font-family="monospace" font-size="11">* contracts/bounded-options/src/types.rs::Series</text>
  <text x="728" y="158" fill="#8b98a5" font-family="monospace" font-size="11">* Grain: (underlying, kind, expiry_ns, K_low)</text>
  <text x="728" y="176" fill="#8b98a5" font-family="monospace" font-size="11">* Unit Scale: 10^6 atoms = $1.00 USDT (u6)</text>

  <text x="728" y="206" fill="#f4ede4" font-family="sans-serif" font-size="12" font-weight="700">Certified Measures (Formulas)</text>
  <rect x="728" y="218" width="324" height="44" rx="6" fill="#0b1117" stroke="#22303c"/>
  <text x="738" y="235" fill="#c6f24e" font-family="monospace" font-size="11" font-weight="600">Measure: CallSpreadPayoff(S_T)</text>
  <text x="738" y="252" fill="#e6edf3" font-family="monospace" font-size="11">clamp(S_T - K_low, 0, K_high - K_low) * qty</text>

  <rect x="728" y="270" width="324" height="44" rx="6" fill="#0b1117" stroke="#22303c"/>
  <text x="738" y="287" fill="#5fc39c" font-family="monospace" font-size="11" font-weight="600">Measure: PutSpreadPayoff(S_T)</text>
  <text x="738" y="304" fill="#e6edf3" font-family="monospace" font-size="11">clamp(K_high - S_T, 0, K_high - K_low) * qty</text>

  <rect x="728" y="322" width="324" height="44" rx="6" fill="#0b1117" stroke="#22303c"/>
  <text x="738" y="339" fill="#c6f24e" font-family="monospace" font-size="11" font-weight="600">Measure: BreakEvenPrice(kind, unit_cost)</text>
  <text x="738" y="356" fill="#e6edf3" font-family="monospace" font-size="11">Call: K_low + unit_cost | Put: K_high - unit_cost</text>

  <text x="728" y="392" fill="#6e7f91" font-family="monospace" font-size="10">Invariant: locked_collateral == (K_high - K_low) * open_qty</text>
</svg>